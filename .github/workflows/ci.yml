name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: these jobs only ever read the checked-out repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Security audit (code)
        run: uv run bandit -c pyproject.toml -r src -q
      - name: Security audit (dependencies)
        run: uv run pip-audit

  # The suite fakes every external effect, so this is about the platform itself:
  # paths, signals, file modes, `ps` vs `tasklist`. Lint and types are the same
  # everywhere and run once, above.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Tests
        run: uv run pytest -q
