name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs these same jobs on the tagged commit before it builds anything.
  workflow_call:

# Least privilege: these jobs only ever read the checked-out repository.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # Pinned so a result never depends on whichever interpreter the runner image has.
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy src
      - name: Tests
        run: uv run pytest -q
      - name: Security audit (code)
        run: uv run bandit -c pyproject.toml -r src -q
      - name: Security audit (dependencies)
        run: uv run pip-audit

  # The suite fakes every external effect, so this is about the platform itself:
  # paths, signals, file modes, `ps` vs `tasklist`. Lint and types are the same
  # everywhere and run once, above.
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      UV_PYTHON: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Tests
        run: uv run pytest -q

  # The oldest Python that pyproject.toml's requires-python accepts; the jobs above
  # cover the newest.
  tests-floor:
    name: tests (python 3.11)
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
      - name: Sync dependencies
        run: uv sync --dev
      - name: Tests
        run: uv run pytest -q
