name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The full CI suite on the tagged commit: nothing is built or published unless it
  # passes. The called jobs only read the repository.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Tag matches pyproject version
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "pyproject.toml says ${version} but the tag says ${GITHUB_REF_NAME}"
            exit 1
          }
      # The release body comes from CHANGELOG.md, so a version without an entry is a
      # release nobody can read. Fail here, before anything reaches PyPI.
      - name: Changelog has an entry for this version
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="${version}" \
            '$0 == "## [" v "]" || index($0, "## [" v "] ") == 1 { f = 1; next }
             f && /^## \[/ { exit }
             f { print }' CHANGELOG.md > release-notes.md
          test -s release-notes.md || {
            echo "CHANGELOG.md has no '## [${version}]' section"
            exit 1
          }
          # The section body uses reference-style links ([#10]); carry their
          # definitions across or they render as dead text in the release body.
          grep '^\[' CHANGELOG.md >> release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # OIDC trusted publishing against the PyPI publisher pinned to this workflow
    # and the `pypi` environment — no API token exists anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/lepika/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --notes-file release-notes.md
          else
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "LePika ${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
