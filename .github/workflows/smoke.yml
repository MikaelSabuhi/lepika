name: Smoke

# The real thing on real machines, once a week: `ollama` and `open-webui` track
# latest (docs/architecture.md), so an upstream change should break this run
# before it breaks a user. Also on release tags, on demand, and on PRs that touch
# the smoke itself. Not a required check.
#
# vLLM (Server mode, Linux + NVIDIA) has no job here: it needs a GPU runner.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/smoke.yml
      - .github/scripts/smoke.sh
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A scratch home, exported here rather than in the job's `env:` — the
      # runner's temp dir is only nameable from inside a step. Every later step,
      # including Logs on failure, then reads the same one.
      - name: Scratch LEPIKA_HOME
        run: echo "LEPIKA_HOME=$RUNNER_TEMP/lepika-home" >> "$GITHUB_ENV"
      - name: Install lepika from this checkout
        run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      - name: Smoke (Server mode)
        run: .github/scripts/smoke.sh server
      - name: Logs
        if: always()
        run: lepika logs --lines 200

  express:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # A scratch home, exported here rather than in the job's `env:` — the
      # runner's temp dir is only nameable from inside a step. Every later step,
      # including Logs on failure, then reads the same one.
      - name: Scratch LEPIKA_HOME
        run: echo "LEPIKA_HOME=$RUNNER_TEMP/lepika-home" >> "$GITHUB_ENV"
      - name: Install lepika from this checkout
        run: |
          uv tool install .
          uv tool dir --bin >> "$GITHUB_PATH"
      # On Windows the Ollama installer only adds itself to the *next* shell's
      # PATH, so LePika's own winget step would end in "open a new terminal".
      # Install it here, the way a user who already has Ollama looks to LePika.
      - name: Ollama (Windows)
        if: runner.os == 'Windows'
        run: |
          winget install --id Ollama.Ollama -e --accept-package-agreements --accept-source-agreements
          echo "$LOCALAPPDATA/Programs/Ollama" >> "$GITHUB_PATH"
      - name: Smoke (Express mode)
        run: .github/scripts/smoke.sh express
      - name: Logs
        if: always()
        run: lepika logs --lines 200
